<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Havenwood - Hex Tile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Hex dimensions: 2" per side
           flat-to-flat: 3.46" (346px at 100dpi, 1038px at 300dpi)
           point-to-point: 4" (400px at 100dpi, 1200px at 300dpi) */
        .hex-container {
            width: 400px;
            height: 462px; /* sqrt(3) * 400px / 2 * 2 + 400px/2 */
            position: relative;
        }
        
        .hexagon {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: #228B22;
            position: relative;
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .hex-content {
            position: absolute;
            width: 90%;
            height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }
        
        .tree-icon {
            font-size: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3));
        }
        
        .title {
            font-size: 28px;
            font-weight: 800;
            color: #FFF;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 6px;
        }
        
        .subtitle {
            font-size: 20px;
            color: #FFD700;
            font-weight: 700;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 6px;
        }
        
        .crown-icon {
            position: absolute;
            top: 15%;
            font-size: 60px;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3));
        }
        
        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            
            .hex-container {
                width: 4in;
                height: 4.62in;
                page-break-after: always;
            }
            
            @page {
                size: 5in 6in;
                margin: 0.5in;
            }
        }
    </style>
</head>
<body>
    <div class="hex-container">
        <div class="hexagon">
            <div class="hex-content">
                <div class="crown-icon">👑</div>
                <div class="tree-icon">🌳</div>
                <div class="title">Central Havenwood</div>
                <div class="subtitle">Safe Zone</div>
            </div>
        </div>
    </div>
</body>
</html>
