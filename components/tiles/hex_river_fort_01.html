<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River - Free Fort Lvl 1 - Hex Tile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .hex-container {
            width: 400px;
            height: 462px;
            position: relative;
        }
        
        .hexagon {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: #4682B4;
            position: relative;
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .hex-content {
            position: absolute;
            width: 90%;
            height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }
        
        .resource-icon {
            font-size: 140px;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3));
        }
        
        .discovery-badge {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            min-width: 120px;
            padding: 8px 16px;
            border-radius: 35px;
            background: #B0C4DE;
            border: 3px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3));
        }
        
        .discovery-text {
            font-size: 12px;
            line-height: 1.1;
            font-weight: 700;
            white-space: nowrap;
        }
        
        .allowed-buildings {
            position: absolute;
            bottom: 8%;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 6px;
            border: 2px solid #000;
        }
        
        .building-icon {
            font-size: 32px;
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.3));
        }
        
        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            
            .hex-container {
                width: 4in;
                height: 4.62in;
                page-break-after: always;
            }
            
            @page {
                size: 5in 6in;
                margin: 0.5in;
            }
        }
    </style>
</head>
<body>
    <div class="hex-container">
        <div class="hexagon">
            <div class="hex-content">
                <div class="discovery-badge">
                    <div class="discovery-text">Free Fort Lvl 1</div>
                </div>
                <div class="resource-icon">💧</div>
                <div class="allowed-buildings">
                    <div class="building-icon">🏡</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
