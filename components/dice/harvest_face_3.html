<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Dice Face 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Raleway', sans-serif;
    }

    .dice-face {
      width: 256px;
      height: 256px;
      background: #D2941D;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #8B6914;
      border-radius: 8px;
    }

    .number {
      font-size: 180px;
      font-weight: 800;
      color: white;
      line-height: 1;
    }

    @media print {
      body {
        margin: 0;
        padding: 0;
      }
      .dice-face {
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="dice-face">
    <div class="number">3</div>
  </div>
</body>
</html>
