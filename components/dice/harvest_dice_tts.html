<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Dice - TTS Template</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Raleway', sans-serif;
      background: transparent;
    }

    .tts-container {
      width: 768px;
      height: 512px;
      display: grid;
      grid-template-columns: repeat(3, 256px);
      grid-template-rows: repeat(2, 256px);
      gap: 0;
      margin: 0;
      padding: 0;
    }

    .dice-face {
      width: 256px;
      height: 256px;
      background: #D2941D;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #8B6914;
      border-radius: 8px;
      position: relative;
      margin: 0;
      padding: 0;
    }

    .number {
      font-size: 180px;
      font-weight: 800;
      color: white;
      line-height: 1;
    }

    /* Bust face styles */
    .dice-face.bust {
      flex-direction: column;
    }

    .acorn {
      position: relative;
      width: 120px;
      height: 140px;
      margin-bottom: 10px;
    }

    .acorn-cap {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 40px;
      background: #6B4423;
      border-radius: 45px 45px 0 0;
      border: 3px solid #4a2f18;
    }

    .acorn-cap::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 5px;
      right: 5px;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        #4a2f18 0px,
        #4a2f18 6px,
        transparent 6px,
        transparent 12px
      );
    }

    .acorn-body {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 100px;
      background: #D2691E;
      border-radius: 40px 40px 50px 50px;
      border: 3px solid #A0522D;
    }

    .crack {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 95px;
      background: #2F1810;
      z-index: 10;
    }

    .crack::before {
      content: '';
      position: absolute;
      top: 20px;
      left: -6px;
      width: 16px;
      height: 4px;
      background: #2F1810;
      transform: rotate(-15deg);
    }

    .crack::after {
      content: '';
      position: absolute;
      top: 55px;
      left: -8px;
      width: 20px;
      height: 4px;
      background: #2F1810;
      transform: rotate(20deg);
    }

    .bust-text {
      font-size: 42px;
      font-weight: 800;
      color: white;
      letter-spacing: 2px;
    }

    /* Blank face dot */
    .dot {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="tts-container">
    <!-- Row 1: Faces 1, 2, 3 -->
    <div class="dice-face">
      <div class="number">1</div>
    </div>
    
    <div class="dice-face">
      <div class="number">2</div>
    </div>
    
    <div class="dice-face">
      <div class="number">3</div>
    </div>
    
    <!-- Row 2: Faces 4 (Bust), 5 (Bust), 6 (Blank) -->
    <div class="dice-face bust">
      <div class="acorn">
        <div class="acorn-cap"></div>
        <div class="acorn-body"></div>
        <div class="crack"></div>
      </div>
      <div class="bust-text">BUST</div>
    </div>
    
    <div class="dice-face bust">
      <div class="acorn">
        <div class="acorn-cap"></div>
        <div class="acorn-body"></div>
        <div class="crack"></div>
      </div>
      <div class="bust-text">BUST</div>
    </div>
    
    <div class="dice-face">
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
