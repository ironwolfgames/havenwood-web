<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Wall Level 3 - Houses of Havenwood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .token {
            width: 225px;
            height: 225px;
            background: #90A4AE;
            border: 5px solid #546E7A;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .wall {
            width: 140px;
            height: 100px;
            position: relative;
            margin-bottom: 5px;
        }
        
        .towers {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        
        .tower {
            width: 25px;
            height: 35px;
            background: #ECEFF1;
            border: 2px solid #546E7A;
            border-radius: 4px 4px 0 0;
            position: relative;
        }
        
        .tower::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 12px solid #78909C;
            top: -10px;
            left: 0.5px;
        }
        
        .battlements {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 4px;
        }
        
        .battlement {
            width: 18px;
            height: 18px;
            background: #ECEFF1;
            border: 2px solid #546E7A;
            border-radius: 2px 2px 0 0;
        }
        
        .stone-row {
            display: flex;
            gap: 3px;
            margin-bottom: 3px;
        }
        
        .stone {
            width: 30px;
            height: 15px;
            background: #CFD8DC;
            border: 1px solid #546E7A;
            border-radius: 2px;
        }
        
        .level {
            font-size: 64px;
            font-weight: 800;
            color: #263238;
            letter-spacing: -2px;
        }
        
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .token {
                width: 0.75in;
                height: 0.75in;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="token">
        <div class="wall">
            <div class="towers">
                <div class="tower"></div>
                <div class="tower"></div>
            </div>
            <div class="battlements">
                <div class="battlement"></div>
                <div class="battlement"></div>
                <div class="battlement"></div>
            </div>
            <div class="stone-row">
                <div class="stone"></div>
                <div class="stone"></div>
                <div class="stone"></div>
                <div class="stone"></div>
            </div>
        </div>
        <div class="level">3</div>
    </div>
</body>
</html>
