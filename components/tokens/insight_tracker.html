<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight Tracker - Houses of Havenwood</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .token {
            width: 300px;
            height: 300px;
            background: #9370DB;
            border: 6px solid #4B0082;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .crystal-ball {
            width: 110px;
            height: 110px;
            position: relative;
            margin-bottom: 10px;
        }
        
        /* Crystal sphere */
        .crystal-ball::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            background: rgba(186,85,211,0.5);
            border: 4px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            left: 10px;
            top: 5px;
        }
        
        /* Base/stand */
        .crystal-ball::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 15px;
            background: #6A5ACD;
            border: 3px solid #2F2F4F;
            border-radius: 50% / 20%;
            bottom: 0;
            left: 25px;
        }
        
        .sparkle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #FFFFFF 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .sparkle:nth-child(1) {
            top: 20px;
            left: 35px;
            width: 15px;
            height: 15px;
        }
        
        .sparkle:nth-child(2) {
            top: 50px;
            right: 25px;
            width: 10px;
            height: 10px;
        }
        
        .sparkle:nth-child(3) {
            bottom: 35px;
            left: 20px;
            width: 8px;
            height: 8px;
        }
        
        .text {
            font-size: 48px;
            font-weight: 800;
            color: #FFFFFF;
        }
        
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .token {
                width: 1in;
                height: 1in;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="token">
        <div class="crystal-ball">
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
        </div>
        <div class="text">Insight</div>
    </div>
</body>
</html>
