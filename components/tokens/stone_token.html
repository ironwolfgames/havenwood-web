<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Token - Houses of Havenwood</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .token {
            width: 300px;
            height: 300px;
            background: #C0C0C0;
            border: 6px solid #A9A9A9;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .block {
            width: 90px;
            height: 80px;
            position: relative;
            margin-bottom: 15px;
        }
        
        .block::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 60px;
            background: #989898;
            border: 3px solid #696969;
            border-radius: 4px;
            top: 10px;
            left: 5px;
        }
        
        .block::after {
            content: '';
            position: absolute;
            width: 70px;
            height: 50px;
            background: #A9A9A9;
            border: 3px solid #696969;
            border-radius: 4px;
            top: 0;
            left: 0;
        }
        
        .text {
            font-size: 48px;
            font-weight: 800;
            color: #2F4F4F;
        }
        
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .token {
                width: 1in;
                height: 1in;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="token">
        <div class="block"></div>
        <div class="text">Stone</div>
    </div>
</body>
</html>
